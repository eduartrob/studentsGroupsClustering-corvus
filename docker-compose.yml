version: '3.8'

services:
  # Servicio de Base de Datos PostgreSQL
  # (Si ya tienes PostgreSQL corriendo en tu laptop en el puerto 5433,
  #  deberás detenerlo antes de levantar este contenedor, o cambiar el puerto en "ports")
  db:
    image: postgres:15-alpine
    container_name: corvus_db_container
    restart: always
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: davity333
      POSTGRES_DB: corvus_auth_db
    ports:
      - "5433:5432"  # Mapea el puerto 5433 de tu lap al 5432 interno del contenedor
    volumes:
      - postgres_data:/var/lib/postgresql/data
    networks:
      - corvus_network

  # Servicio de la Aplicación FastAPI
  web:
    build: .
    container_name: corvus_api_container
    restart: always
    ports:
      - "8000:8000"
    environment:
      # Si usas la base de datos de Docker Compose, usa 'db' como host.
      # Si quieres usar una base de datos que corre DIRECTO en tu lap (fuera de Docker),
      # cambia 'db' por 'host.docker.internal' y asegúrate de configurar extra_hosts abajo.
      - DATABASE_URL=postgresql://postgres:davity333@db:5432/corvus_auth_db
      - DEV_BYPASS=true
      - JWT_SECRET=super_secret_corvus_dev_key
      - JWT_ALGORITHM=HS256
    depends_on:
      - db
    networks:
      - corvus_network
    extra_hosts:
      - "host.docker.internal:host-gateway" # Permite conectar al localhost de tu lap física

volumes:
  postgres_data:

networks:
  corvus_network:
    driver: bridge
